title: yateff
description: Notes on computer science, machine learning, and things I'm building.
url: "https://yateff.github.io"
baseurl: ""

markdown: kramdown
permalink: /:year/:month/:title/

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - LICENSE

remote_theme: pages-themes/minimal@v0.2.0
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
